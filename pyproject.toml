[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-rewind"
version = "0.1.0"
description = "Record, inspect and fork agent trajectories with immutable SQLite checkpoints."
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Vijay Athuluri"}]
dependencies = []

[project.scripts]
agent-rewind = "agent_rewind.__main__:main"

[tool.setuptools.package-data]
agent_rewind = ["web/*"]
